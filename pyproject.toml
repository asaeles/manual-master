[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manual-master"
version = "0.1.0"
authors = [
  {name = "Ahmad Sulaeman", email = "asaeles@gmail.com"},
]
description = "CLI RAG tool using LangChain + OpenAI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain",
    "langchain-chroma",
    "langchain-community",
    "langchain-openai",
    "python-magic; sys.platform != \"win32\"",
    "python-magic-bin; sys.platform == \"win32\"",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/asaeles/manual-master"

[project.scripts]
manual-master = "manual_master.app:main"