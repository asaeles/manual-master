[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manual-master"
version = "0.1.1"
description = "Multi-Format RAG Tool"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
dependencies = [
    "langchain==1.3.14",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.2",
    "langchain-openai==1.4.3",
    "langchain_text_splitters==1.1.2",
    "langgraph==1.2.10",
    "python-magic; sys.platform != \"win32\"",
    "python-magic-bin==0.4.14; sys.platform == \"win32\""
]

[project.scripts]
manual-master = "manual_master.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
