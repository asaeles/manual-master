[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manual-master"
version = "0.1.0"
description = "Multi-Format RAG Tool"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "beautifulsoup4==4.14.3",
    "langchain-chroma==1.0.0",
    "langchain-community==0.4.1",
    "langchain-openai==1.1.0",
    "langchain==1.1.0",
    "langgraph",
    "lxml==6.0.2",
    "pypdf==6.4.0",
    "python-magic; sys_platform != 'win32'",
    "python-magic-bin==0.4.14; sys_platform == 'win32'",
]

[project.scripts]
manual-master = "manual_master.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
